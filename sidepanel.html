<!doctype html>
<html data-astryx-theme="neutral">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenCode Annotation</title>
    <link rel="stylesheet" href="vendor/astryx/theme.css">
    <style>
      :root {
        --spacing-1: 0.25rem;
        --spacing-2: 0.5rem;
        --spacing-3: 0.75rem;
        --spacing-4: 1rem;
        --spacing-5: 1.25rem;
        --spacing-6: 1.5rem;
        --spacing-8: 2rem;
        --paper: var(--color-background-body);
        --surface: var(--color-background-surface);
        --field: var(--color-background-surface);
        --ink: var(--color-text-primary);
        --ink-2: var(--color-text-secondary);
        --ink-3: var(--color-text-secondary);
        --line: var(--color-border);
        --line-strong: var(--color-border-emphasized);
        --wash: var(--color-overlay-hover);
        --peri: var(--color-accent);
        --peri-tint: var(--color-accent-muted);
        --peri-ink: var(--color-accent);
        --red: var(--color-error);
        --red-tint: var(--color-error-muted);
        --red-ink: var(--color-text-red);
        --green: var(--color-success);
        --green-tint: var(--color-success-muted);
        --green-ink: var(--color-text-green);
        --amber: var(--color-warning);
        --amber-tint: var(--color-warning-muted);
        --on-ink: var(--color-on-accent);
        --on-peri: var(--color-on-accent);
        --ink-hover: var(--color-text-secondary);
        --sans: var(--font-family-body);
        --mono: var(--font-family-code);
        --r-sm: var(--radius-inner);
        --r: var(--radius-element);
        --r-lg: var(--radius-container);
        --shadow-soft: var(--shadow-low);
      }
      * { box-sizing: border-box; }
      html { scrollbar-width: thin; scrollbar-color: var(--color-border-emphasized) transparent; }
      ::selection { background: var(--peri); color: var(--on-peri); }
      body {
        caret-color: var(--color-accent);
        margin: 0;
        font: var(--font-size-base)/1.4286 var(--sans);
        color: var(--ink);
        background: var(--paper);
        padding: var(--spacing-4); max-width: 420px; margin-inline: auto; overflow-x: visible;
      }
      button, textarea { font: inherit; }
      button, .textarea, .search, .session-row, .queue-item, .history-item {
        transition: background 140ms ease, color 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
      }
      :focus-visible { outline: 2px solid var(--peri-ink); outline-offset: 2px; }
      .ic { flex: none; }
      .ic * { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .root { display: flex; flex-direction: column;
        min-height: calc(100dvh - 2 * var(--spacing-4)); gap: var(--spacing-6);
      }
      .root:has(.send-bar) .toast { bottom: calc(2 * var(--spacing-8) + var(--spacing-4)); }
      .section { display: flex; flex-direction: column; margin-top: var(--spacing-2);
        gap: var(--spacing-3); min-width: 0;
      }
      .contents { display: contents; }

      .chat-header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--paper);
        box-shadow: none;
        margin: calc(-1 * var(--spacing-4)) calc(-1 * var(--spacing-4)) 0; padding: var(--spacing-4);
      }
      .send-bar {
        position: sticky;
        bottom: 0;
        z-index: 10;
        display: flex; margin: auto calc(-1 * var(--spacing-4)) calc(-1 * var(--spacing-4)); padding: var(--spacing-4); background: var(--paper); box-shadow: none;
      }
      .send-bar .btn { padding: var(--spacing-3) var(--spacing-4); font-size: var(--font-size-base); }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--spacing-2);
        border-radius: var(--r);
        color: var(--ink);
        font: 600 var(--font-size-sm)/1 var(--sans);
        cursor: pointer;
        white-space: nowrap;
        border: 0; min-height: 36px; padding: var(--spacing-2) var(--spacing-3); line-height: 1.4; background: var(--color-background-muted); box-shadow: none;
      }
      .btn:hover:not(:disabled) {
        background: var(--wash);
      }
      .btn:disabled { color: var(--ink-2); cursor: default; }
      .btn.primary {
        background: var(--peri); color: var(--on-peri); box-shadow: var(--shadow-low);
      }
      .btn.primary:hover:not(:disabled) {
        background: var(--peri); box-shadow: var(--shadow-med);
      }
      .btn.primary:active:not(:disabled) { box-shadow: var(--shadow-low);  }
      .btn.primary:disabled { color: var(--ink-2); box-shadow: none; }
      .btn.small {
        min-height: 34px; padding: var(--spacing-1) var(--spacing-2);
      }
      .btn.full { width: 100%; }
      .btn { min-height: 34px; }
      .theme-btn { flex: none; }
      .btn.ghost { box-shadow: none; background: transparent; color: var(--ink-2); }
      .btn.ghost:hover:not(:disabled) { background: var(--wash); color: var(--ink); }
      .btn.confirm {
        color: var(--on-ink);
        box-shadow: none;
        background: var(--red);
      }
      .btn.confirm:hover:not(:disabled) { background: var(--red-tint); color: var(--red-ink); }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: var(--r);
        background: transparent;
        color: var(--ink-2);
        cursor: pointer;
        padding: 0;
        flex: none;
        width: 28px; height: 28px;
      }
      .icon-btn:hover:not(:disabled) { background: var(--wash); color: var(--ink); }
      .icon-btn:disabled { color: var(--ink-2); cursor: default; }

      .toast {
        position: fixed;
        left: var(--spacing-4);
        right: var(--spacing-4);
        bottom: var(--spacing-4);
        z-index: 100;
        max-width: calc(420px - 2 * var(--spacing-4));
        margin-inline: auto;
        overflow-wrap: anywhere;
        padding: var(--spacing-3) var(--spacing-3);
        border-radius: var(--r-lg);
        font-weight: 650;
        background: var(--surface); color: var(--ink); box-shadow: var(--shadow-high);
      }
      .toast.error {  box-shadow: var(--shadow-low);
        background: var(--red-tint); color: var(--red-ink);
      }
      .added-tick {
        display: inline-flex;
        align-items: center;
        gap: var(--spacing-1);
        padding: var(--spacing-1) var(--spacing-3);
        border-radius: var(--r-sm);
        background: var(--green-tint);
        color: var(--green-ink);
        font: 600 var(--font-size-sm)/1.4 var(--sans);
        white-space: nowrap;
        flex: none;
      }
      .count {
        min-width: 20px;
        padding: var(--spacing-1) var(--spacing-2);
        border-radius: var(--r-sm);
        background: var(--ink);
        color: var(--on-ink);
        font: 600 var(--font-size-sm)/1.4 var(--mono);
        text-align: center;
      }

      .header { display: flex;  justify-content: space-between; gap: var(--spacing-2);
        align-items: start;
      }
      .title { font-weight: 600;  letter-spacing: -0.01em;
        font-size: var(--font-size-lg); line-height: 1.4;
      }
      .hint { color: var(--ink-3);
        font-size: var(--font-size-sm); line-height: 1.5;
      }
      .grow { flex: 1 1 auto; min-width: 0; }
      .row { display: flex; align-items: center; gap: var(--spacing-2); }
      .row.split { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-2); }
      .row.split .btn.ghost {
        box-shadow: none;
        background: var(--red-tint);
        color: var(--red-ink);
      }
      .row.split .btn.ghost:hover:not(:disabled) {
        background: var(--red);
        color: var(--color-on-error);
      }
      .row.end { justify-content: flex-end; }
      .row.between { justify-content: space-between; align-items: flex-start; }
      .section-head { display: flex; align-items: center; gap: var(--spacing-1); }
      .section-toggle { width: 22px; height: 22px; }
      .section-toggle .ic { transition: transform 140ms ease; }
      .section-toggle.closed .ic { transform: rotate(-90deg); }
      .list.collapsed { display: none; }
      .section-head .title {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: var(--font-size-xs);
        color: var(--ink-2);
 display: flex; align-items: center; gap: var(--spacing-2); }
      .card {
        border-radius: var(--r-lg);
        display: flex;
        flex-direction: column;
        background: var(--surface);
        padding: var(--spacing-4); gap: var(--spacing-4); box-shadow: var(--shadow-med);
      }

      .picking {
        display: flex;
        align-items: center;
        gap: var(--spacing-2);
        padding: var(--spacing-2) var(--spacing-2) var(--spacing-2) var(--spacing-3);
        box-shadow: none;
        border-radius: var(--r-lg);
        background: var(--peri-tint);
        color: var(--ink);
        font-weight: 600;
      }

      .textarea {
        width: 100%;
        resize: vertical;
        border-radius: var(--r);
        box-shadow: none;
        background: var(--field);
        color: var(--ink);
        padding: var(--spacing-3) var(--spacing-3);
        font: var(--font-size-base)/1.45 var(--sans);
        min-height: 112px;
      }
      .textarea::placeholder { color: var(--ink-3); }
      .textarea:focus { outline: none; box-shadow: none; }
      .element-row { display: flex; align-items: center; gap: var(--spacing-2); }
      .selection-preview {
        display: block;
        align-self: center;
        width: auto;
        max-width: 100%;
        max-height: 132px;
        object-fit: contain;
        border-radius: var(--r-sm);
        box-shadow: 0 0 0 1px var(--line);
        background: var(--color-background-body);
      }
      .element-info {
        border-radius: var(--r-sm);
        color: var(--ink-2);
        box-shadow: none;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: left;
        font: 500 var(--font-size-sm)/1.45 var(--mono);
        background: transparent; padding: 0; font-size: var(--font-size-sm);
        cursor: copy;
      }
      .element-info:hover:not(:disabled) { color: var(--ink); }

      .queue-item {
        display: flex;
        align-items: flex-start;
        border-radius: var(--r-lg);
        background: transparent;
        padding: var(--spacing-3) var(--spacing-2);
        gap: var(--spacing-2);
        box-shadow: var(--shadow-low);
        transition: box-shadow 140ms ease, transform 140ms ease;
      }
      .queue-item:hover { box-shadow: var(--shadow-med); transform: translateY(-1px); }
      .menu-wrap { position: relative; flex: none; }
      .menu {
        position: absolute;
        right: 0;
        top: calc(100% + 4px);
        z-index: 20;
        min-width: 148px;
        padding: var(--spacing-1);
        display: flex;
        flex-direction: column;
        gap: 2px;
        border-radius: var(--r);
        background: var(--color-background-surface);
        box-shadow: 0 0 0 1px var(--line), var(--shadow-med);
      }
      .menu-item {
        display: flex;
        align-items: center;
        gap: var(--spacing-2);
        width: 100%;
        padding: var(--spacing-2) var(--spacing-3);
        border: 0;
        border-radius: var(--r-sm);
        background: transparent;
        color: var(--ink);
        font: 500 var(--font-size-sm)/1.2 var(--sans);
        text-align: left;
        cursor: pointer;
      }
      .menu-item:hover:not(:disabled) { background: var(--wash); }
      .menu-item:disabled { color: var(--ink-3); cursor: default; }
      .menu-item .ic { color: var(--ink-2); }
      .queue-item .queue-item-actions { opacity: 0; transition: opacity 120ms ease; }
      .queue-item:hover .queue-item-actions,
      .queue-item:focus-within .queue-item-actions { opacity: 1; }
      .queue-shot-btn {
        flex: none;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: zoom-in;
        border-radius: var(--r-sm);
      }
      .queue-shot-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: grid;
        place-items: center;
        padding: var(--spacing-4);
        background: light-dark(rgb(0 0 0 / 55%), rgb(0 0 0 / 78%));
        cursor: zoom-out;
      }
      .lightbox-img {
        width: min(100%, 420px);
        height: auto;
        max-height: 100%;
        object-fit: contain;
        border-radius: var(--r);
        box-shadow: 0 0 0 1px var(--line-strong), var(--shadow-high);
        background: var(--color-background-body);
      }
      .queue-shot {
        flex: none;
        width: 52px;
        height: 34px;
        margin-top: 1px;
        object-fit: contain;
        border-radius: var(--r-sm);
        background: transparent;
      }
      .queue-num {
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--r-sm);
        background: transparent;
        color: var(--ink-2);
        font: 600 var(--font-size-sm)/1 var(--mono);
        width: 24px; height: 24px; margin-top: 0;
      }
      .queue-comment {  word-break: break-word;
        font-weight: 400; line-height: 1.5;
      }
      .queue-comment.empty { color: var(--ink-3); font-style: italic; font-weight: 400; }
      .queue-comment[role="button"] { cursor: text; border-radius: var(--r-sm); }
      .queue-comment[role="button"]:hover { background: var(--wash); }
      .queue-comment[role="button"]:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
      .queue-edit {
        width: 100%;
        min-height: 0;
        field-sizing: content;
        padding: 0;
        border: 0;
        border-radius: var(--r-sm);
        box-shadow: 0 0 0 1px var(--color-accent);
        background: var(--field);
        color: var(--ink);
        font: 500 var(--font-size-base)/1.5 var(--sans);
        resize: vertical;
      }
      .queue-selector {
        margin-top: var(--spacing-1);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--ink-3);
        font: 500 var(--font-size-sm)/1.4 var(--mono);
        font-size: var(--font-size-sm);
      }
      .queue-meta {
        color: var(--ink-3);
        font-size: var(--font-size-sm);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1 1 auto;
        min-width: 0;
      }
      .queue-item-actions { display: inline-flex; align-items: center; gap: 0; flex: none; margin-top: calc(-1 * var(--spacing-1)); }
      .send-failure {
        background: var(--red-tint);
        border-radius: var(--r-lg);
        padding: var(--spacing-3) var(--spacing-3);
        display: flex;
        flex-direction: column;
        gap: var(--spacing-2);
        color: var(--red-ink); box-shadow: none;
      }
      .send-failure-text { line-height: 1.45; word-break: break-word; }

      .history-item {
        display: flex;
        align-items: flex-start;
        gap: var(--spacing-3);
        border-radius: var(--r-lg);
        background: transparent; padding: var(--spacing-2) 0; box-shadow: none;
      }
      .history-item.failed { box-shadow: none; }
      .history-summary {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--ink-2);
        font-weight: 550;
      }
      .history-mark {
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        margin-top: 0;
        border-radius: var(--r-sm);
        font: 600 var(--font-size-sm)/1 var(--sans);
        font-family: var(--sans);
      }
      .history-mark.sent { background: var(--green-tint); color: var(--green-ink); }
      .history-mark.partial { background: var(--amber-tint);
        color: var(--color-text-yellow);
      }
      .history-mark.failed {
        background: var(--red-tint); color: var(--red-ink);
      }
      .count.quiet { background: transparent; color: var(--ink-2); box-shadow: none; }
      .list.cards {
        gap: var(--spacing-3); padding: 0;
      }
      .history-error { margin-top: var(--spacing-1); color: var(--red-ink); font-size: var(--font-size-sm); word-break: break-word; line-height: 1.45; }

      .linked {
        display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; align-items: start; gap: var(--spacing-2);
      }
      .header .title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .header .row:first-child { min-width: 0; flex: 1 1 auto; }
      .session-icon {
        font-size: 18px;
        line-height: 1;
        flex: none;
        margin-right: var(--spacing-1);
      }
      .linked-label {
        display: flex;
        align-items: center;
        gap: var(--spacing-2);
        min-width: 0;
        font-weight: 600;
        letter-spacing: -0.01em;
        font-size: var(--font-size-2xl);
        line-height: 1.25;
        text-wrap: balance;
        letter-spacing: -0.02em;
      }
      .linked-label > span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      html[data-theme="light"] { --paper: whitesmoke; }
      .linked-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: var(--spacing-1);
        flex: none;
        color: var(--ink-2);
        font: 600 var(--font-size-sm)/1 var(--mono);
      }
      .status-glyph { display: inline-flex; }
      .status[data-state="done"] { color: var(--green-ink); }
      .status[data-state="failed"] { color: var(--red-ink); }
      .status[data-state="cancelled"] { color: var(--amber); }
      .status[data-state="working"] { color: var(--peri-ink); }
      .status-time { font-weight: 500; letter-spacing: 0; white-space: nowrap; }
      .spinner { display: inline-flex; animation: status-spin 900ms linear infinite; }
      @keyframes status-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
      .linked-tags {
        display: flex;
        align-items: center;
        gap: var(--spacing-2);
        flex-wrap: nowrap;
        min-width: 0;
        margin-top: var(--spacing-1);
      }
      .linked-meta {
        display: flex;
        align-items: center;
        gap: var(--spacing-2);
        min-width: 0;
        color: var(--ink-2);
        font: 500 var(--font-size-sm)/1.4 var(--sans);
        flex-wrap: wrap; font-size: var(--font-size-sm);
      }
      .linked-project { display: inline-flex; align-items: center; gap: var(--spacing-2); min-width: 0; overflow: hidden;
        padding: var(--spacing-1) var(--spacing-2); background: var(--surface); border-radius: var(--r-sm); max-width: 100%;
      }
      .activity {
        display: inline-flex;
        align-items: center;
        gap: var(--spacing-2);
        margin-top: 0;
        padding: var(--spacing-1) var(--spacing-2);
        border-radius: var(--r-sm);
        box-shadow: none;
        font: 600 var(--font-size-sm)/1.3 var(--sans);
        width: fit-content;
        max-width: 100%;
        color: var(--ink-2);
        background: var(--wash);
        flex: none; letter-spacing: normal; text-transform: none; font-size: var(--font-size-sm); line-height: 1.5;
      }
      .activity .dot {
        width: 6px;
        height: 6px;
        border-radius: var(--radius-full);
        background: currentColor;
        flex: none;
      }
      .activity-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .activity-time {
        font-weight: 500;
        letter-spacing: 0;
        white-space: nowrap;
      }
      .activity[data-state="working"] { color: var(--peri-ink); background: var(--peri-tint); }
      .activity[data-state="working"] .dot { animation: activity-pulse 1.1s ease-in-out infinite; }
      .activity[data-state="done"] { color: var(--green-ink); background: var(--green-tint); }
      .activity[data-state="failed"] { color: var(--red-ink); background: var(--red-tint); }
      .activity[data-state="cancelled"] { color: var(--amber); background: var(--amber-tint); }
      @keyframes activity-pulse { 50% { opacity: 0.3; } }
      @media (prefers-reduced-motion: reduce) { .activity .dot { animation: none !important; } }

      .search {
        width: 100%;
        padding: var(--spacing-2) 0;
        border-radius: 0;
        box-shadow: inset 0 -1px 0 var(--line-strong);
        background: transparent;
        color: var(--ink);
        font: var(--font-size-base)/1.4 var(--sans);
      }
      .search::placeholder { color: var(--ink-3); font-style: italic; }
      .search:focus { outline: none; box-shadow: inset 0 -2px 0 var(--color-accent); }
      .chips-foot { display: flex; justify-content: flex-end; padding-top: var(--spacing-2); }
      .chips-wrap {
        display: flex;
        align-items: center;
        gap: var(--spacing-2);
        margin-bottom: var(--spacing-1);
      }
      .chips {
        display: flex;
        flex-wrap: nowrap;
        gap: var(--spacing-2);
        overflow-x: auto;
        scrollbar-width: none;
        flex: 1 1 auto;
        min-width: 0;
        padding-block: var(--spacing-1);
      }
      .chips::-webkit-scrollbar { display: none; }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: var(--spacing-2);
        border-radius: var(--r);
        box-shadow: none;
        color: var(--ink);
        cursor: pointer;
        font: 600 var(--font-size-sm)/1 var(--sans);
        white-space: nowrap;
        flex: none;
        border: 0; min-height: 32px; background: transparent; padding: var(--spacing-2);
      }
      .chip:hover { box-shadow: none;
        background: var(--wash);
      }
      .chip.active { background: var(--ink); color: var(--on-ink); box-shadow: none; }
      .chip.toggle { flex: none; border-style: dashed; color: var(--ink-2); }
      .chip > span:not(.project-dot) { max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
      .chips.single .chip { flex-shrink: 1; min-width: 0; }
      .chips.single .chip:first-child { flex-shrink: 0; }
      .chips-more {
        display: flex;
        flex-wrap: wrap;
        gap: var(--spacing-2);
        margin-top: calc(-1 * var(--spacing-1));
      }
      .results-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--spacing-2);
        padding: var(--spacing-1) var(--spacing-1) 0;
      }
      .results-label {
        font: 600 var(--font-size-sm)/1.4 var(--sans);
        color: var(--ink-3);
        letter-spacing: normal; text-transform: none;
      }
      .results-count {
        display: inline-flex;
        align-items: center;
        gap: var(--spacing-1);
        color: var(--ink-2);
        font: 600 var(--font-size-sm)/1 var(--mono);
        white-space: nowrap;
      }
      .search-clear { width: 18px; height: 18px; font: 600 var(--font-size-sm)/1 var(--sans); }

      .list { display: flex; flex-direction: column; gap: var(--spacing-1); padding: var(--spacing-1) 0; }
      .session-row {
        display: flex;
        align-items: center;
        gap: var(--spacing-1);
        border-radius: var(--r-lg);
        background: var(--surface);
        box-shadow:
          0 4px 6px light-dark(oklch(0 0 0 / 5%), oklch(0 0 0 / 25%)),
          0 10px 18px light-dark(oklch(0 0 0 / 10%), oklch(0 0 0 / 40%)),
          inset 0 0 0 1px light-dark(transparent, oklch(1 0 0 / 8%));
        padding: 0;
      }
      .session-row:hover { background: var(--surface);
        box-shadow:
          0 6px 8px light-dark(oklch(0 0 0 / 5%), oklch(0 0 0 / 25%)),
          0 14px 24px light-dark(oklch(0 0 0 / 10%), oklch(0 0 0 / 40%)),
          inset 0 0 0 1px light-dark(transparent, oklch(1 0 0 / 8%));
      }
      .session-row .session-item { flex: 1 1 auto; min-width: 0; }
      .session-row .session-close {
        flex: none;
        width: 26px; height: 26px;
        align-self: center;
        margin-right: var(--spacing-2);
        border-radius: var(--r);
        color: var(--ink-2);
        opacity: 0;
        transition: opacity 120ms ease, color 120ms ease, background-color 120ms ease;
      }
      .session-row .session-close:hover:not(:disabled) {
        background: transparent;
        color: var(--red-ink);
      }
      .session-row:hover .session-close,
      .session-row:focus-within .session-close { opacity: 1; }
      .session-item {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        font: var(--font-size-base)/1.35 var(--sans);
        padding: var(--spacing-3); font-size: var(--font-size-base); line-height: 1.5; border-radius: var(--r);
      }
      .session-item:disabled { cursor: default; color: var(--ink-2); }
      .session-name {  overflow-wrap: anywhere;
        font-weight: 500;
      }
      .session-meta {
        margin-top: var(--spacing-1);
        display: flex;
        align-items: center;
        gap: var(--spacing-2);
        color: var(--ink-2);
        font: 500 var(--font-size-sm)/1.4 var(--sans);
        overflow: hidden;
      }
      .session-date { flex: none; color: var(--ink-3); font: 500 var(--font-size-sm)/1.4 var(--sans); }
      .project-dot {
        width: 8px;
        height: 8px;
        border-radius: var(--radius-full);
        background: var(--color-icon-secondary);
        box-shadow: none;
        flex: none;
      }
      .project-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .linked-chip {
        display: inline-block;
        margin-left: var(--spacing-2);
        padding: var(--spacing-1) var(--spacing-2);
        border-radius: var(--r-sm);
        font: 600 var(--font-size-sm)/1.4 var(--sans);
        background: var(--peri-tint); color: var(--ink);
      }

      .empty-icon { color: var(--ink-3); margin-bottom: var(--spacing-1); }
      .empty-title { font-weight: 600;  margin-bottom: var(--spacing-2);
        font-size: var(--font-size-lg);
      }
      .empty-text { margin: 0 0 var(--spacing-2); color: var(--ink-2); line-height: 1.45; }
      .empty-list { margin: 0; padding-left: var(--spacing-5); color: var(--ink-2); line-height: 1.55; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }




      .header > .row:first-child { min-width: 0; align-items: start; }
      .header > .row:last-child { flex: none; }
      .header .title { font-size: var(--font-size-xl); line-height: 1.25; }

      .btn:disabled, .btn.primary:disabled, .icon-btn:disabled, .session-item:disabled { color: var(--ink-2); background: var(--color-background-muted); box-shadow: none; opacity: 1; }
      .btn.confirm, .btn.confirm:hover:not(:disabled) { color: var(--red-ink); background: var(--red-tint); }

      .card > .row { flex-wrap: wrap; gap: var(--spacing-2); }
      .card > .row > .grow { flex: 0 1 auto; }
      .textarea { border: 0; box-shadow: 0 0 0 1px var(--line); background: var(--field); padding: var(--spacing-3); font-size: var(--font-size-base); line-height: 1.5; }
      .textarea:focus { outline: none; box-shadow: 0 0 0 1px var(--color-accent); }
      .row.split .btn.primary { background: var(--green); color: var(--color-on-success); }
      .row.split .btn.primary:hover:not(:disabled) { background: var(--green-ink); color: var(--color-on-success); }
      .search { border: 0; box-shadow: inset 0 -1px 0 var(--line-strong); padding: var(--spacing-2) 0; font-size: var(--font-size-base); line-height: 1.5; }
      .search:focus { outline: none; box-shadow: inset 0 -2px 0 var(--color-accent); }

      .count { background: var(--color-background-muted); color: var(--ink-2); }

      .history-item .queue-selector { font-family: var(--sans); }

      .send-bar .send { width: 100%; background: var(--color-background-blue); color: var(--color-text-blue); box-shadow: var(--shadow-low); }
      .send-bar .send:disabled { background: var(--color-background-muted); color: var(--ink-2); box-shadow: none; }
      .send-bar .send:hover:not(:disabled) { filter: brightness(1.04); }

      .chip.active { background: var(--color-background-gray); color: var(--color-text-gray); box-shadow: none; }

      .session-meta, .session-date { font-size: var(--font-size-sm); }

      @media (max-width: 359px) {
        .linked { column-gap: var(--spacing-1); }
        .linked > .btn { padding-inline: var(--spacing-1); }
        .card { padding: var(--spacing-3); }
      }
    </style>
  </head>
  <body>
    <script src="sidepanel-dev.js"></script>
    <script src="sidepanel-picker.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
